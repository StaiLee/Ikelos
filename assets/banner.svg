<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-label="IKELOS — website mirroring engine">
  <defs>
    <radialGradient id="space" cx="50%" cy="42%" r="85%">
      <stop offset="0%" stop-color="#07151f"/>
      <stop offset="48%" stop-color="#040c14"/>
      <stop offset="100%" stop-color="#01050a"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a020f0" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#a020f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7df9ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
  </defs>

  <rect width="1280" height="340" fill="url(#space)"/>

  <!-- ambient nebulae -->
  <ellipse cx="300" cy="150" rx="360" ry="230" fill="url(#glowCyan)">
    <animate attributeName="opacity" values="0.55;0.9;0.55" dur="9s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1000" cy="210" rx="380" ry="240" fill="url(#glowPurple)">
    <animate attributeName="opacity" values="0.85;0.5;0.85" dur="11s" repeatCount="indefinite"/>
  </ellipse>

  <!-- twinkling particles -->
  <g fill="#bfeeff">
    <circle cx="130" cy="60" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.1s" repeatCount="indefinite"/></circle>
    <circle cx="250" cy="280" r="1.1"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle cx="450" cy="70" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.8s" repeatCount="indefinite" begin="0.5s"/></circle>
    <circle cx="640" cy="46" r="1.2"><animate attributeName="opacity" values="0.4;1;0.4" dur="2.9s" repeatCount="indefinite" begin="1s"/></circle>
    <circle cx="780" cy="300" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="3.3s" repeatCount="indefinite" begin="0.3s"/></circle>
    <circle cx="915" cy="66" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" repeatCount="indefinite" begin="0.8s"/></circle>
    <circle cx="1060" cy="292" r="1.4"><animate attributeName="opacity" values="1;0.4;1" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="1190" cy="110" r="1.3"><animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite" begin="1.4s"/></circle>
    <circle cx="72" cy="205" r="1.1"><animate attributeName="opacity" values="0.5;1;0.5" dur="2.6s" repeatCount="indefinite" begin="0.6s"/></circle>
    <circle cx="1216" cy="225" r="1.2"><animate attributeName="opacity" values="1;0.3;1" dur="3.4s" repeatCount="indefinite" begin="0.2s"/></circle>
  </g>

  <!-- source window (left) -->
  <g transform="translate(150,112)">
    <rect x="0" y="0" width="176" height="130" rx="10" fill="#08151f" stroke="#00f0ff" stroke-opacity="0.85" stroke-width="1.5"/>
    <rect x="0" y="0" width="176" height="24" rx="10" fill="#0c2130"/>
    <rect x="0" y="14" width="176" height="10" fill="#0c2130"/>
    <circle cx="16" cy="12" r="3" fill="#ff5f56"/><circle cx="30" cy="12" r="3" fill="#ffbd2e"/><circle cx="44" cy="12" r="3" fill="#27c93f"/>
    <rect x="16" y="40"  width="90"  height="9" rx="4" fill="#1c4a5e"/>
    <rect x="16" y="58"  width="144" height="7" rx="3" fill="#143643"/>
    <rect x="16" y="72"  width="130" height="7" rx="3" fill="#143643"/>
    <rect x="16" y="92"  width="60"  height="34" rx="4" fill="#12303c"/>
    <rect x="86" y="92"  width="74"  height="7" rx="3" fill="#143643"/>
    <rect x="86" y="106" width="74"  height="7" rx="3" fill="#143643"/>
    <rect x="86" y="120" width="50"  height="7" rx="3" fill="#143643"/>
  </g>

  <!-- mirrored replica (right) — literally reflected via scale(-1,1) -->
  <g transform="translate(1130,112) scale(-1,1)" opacity="0.92">
    <rect x="0" y="0" width="176" height="130" rx="10" fill="#0a1a15" stroke="#00f0ff" stroke-opacity="0.6" stroke-width="1.5" stroke-dasharray="5 4">
      <animate attributeName="stroke-dashoffset" values="0;-18" dur="1.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="0" y="0" width="176" height="24" rx="10" fill="#0c2130"/>
    <rect x="0" y="14" width="176" height="10" fill="#0c2130"/>
    <circle cx="16" cy="12" r="3" fill="#ff5f56"/><circle cx="30" cy="12" r="3" fill="#ffbd2e"/><circle cx="44" cy="12" r="3" fill="#27c93f"/>
    <rect x="16" y="40" width="90" height="9" rx="4" fill="#1c4a5e"><animate attributeName="opacity" values="0;1" dur="4s" repeatCount="indefinite" begin="0s"/></rect>
    <rect x="16" y="58"  width="144" height="7" rx="3" fill="#143643"><animate attributeName="opacity" values="0;1" dur="4s" repeatCount="indefinite" begin="0.4s"/></rect>
    <rect x="16" y="72"  width="130" height="7" rx="3" fill="#143643"><animate attributeName="opacity" values="0;1" dur="4s" repeatCount="indefinite" begin="0.8s"/></rect>
    <rect x="16" y="92"  width="60"  height="34" rx="4" fill="#12303c"><animate attributeName="opacity" values="0;1" dur="4s" repeatCount="indefinite" begin="1s"/></rect>
    <rect x="86" y="92"  width="74"  height="7" rx="3" fill="#143643"><animate attributeName="opacity" values="0;1" dur="4s" repeatCount="indefinite" begin="1.2s"/></rect>
    <rect x="86" y="106" width="74"  height="7" rx="3" fill="#143643"><animate attributeName="opacity" values="0;1" dur="4s" repeatCount="indefinite" begin="1.5s"/></rect>
    <rect x="86" y="120" width="50"  height="7" rx="3" fill="#143643"><animate attributeName="opacity" values="0;1" dur="4s" repeatCount="indefinite" begin="1.8s"/></rect>
  </g>

  <!-- data streaming from source to replica -->
  <g fill="#7df9ff" filter="url(#glow)">
    <circle r="3.2"><animateMotion dur="2.4s" repeatCount="indefinite" path="M330,205 Q640,250 950,205"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.4s" repeatCount="indefinite"/></circle>
    <circle r="2.6"><animateMotion dur="2.4s" repeatCount="indefinite" begin="0.6s" path="M330,205 Q640,250 950,205"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.4s" repeatCount="indefinite" begin="0.6s"/></circle>
    <circle r="3.0"><animateMotion dur="2.4s" repeatCount="indefinite" begin="1.2s" path="M330,205 Q640,250 950,205"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.4s" repeatCount="indefinite" begin="1.2s"/></circle>
    <circle r="2.4"><animateMotion dur="2.4s" repeatCount="indefinite" begin="1.8s" path="M330,205 Q640,250 950,205"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.85;1" dur="2.4s" repeatCount="indefinite" begin="1.8s"/></circle>
  </g>

  <!-- crawler scan beam -->
  <g opacity="0.5">
    <rect x="-6" y="0" width="12" height="340" fill="url(#beam)">
      <animateTransform attributeName="transform" type="translate" values="-40,0; 1320,0" dur="6.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- title -->
  <g transform="translate(640,150)" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
    <text x="0" y="0" font-size="72" font-weight="800" letter-spacing="16" fill="#00f0ff" filter="url(#softglow)" opacity="0.55">◇ IKELOS</text>
    <text x="0" y="0" font-size="72" font-weight="800" letter-spacing="16" fill="#eafeff">◇ IKELOS
      <animate attributeName="opacity" values="0.88;1;0.88" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="0" y="46" font-size="16.5" font-weight="500" letter-spacing="12" fill="#4fd6e6">WEBSITE&#160;&#160;MIRRORING&#160;&#160;ENGINE</text>
    <text x="0" y="76" font-size="12" letter-spacing="5" fill="#6f8c99">ABSORB · REPLICATE · BROWSE OFFLINE</text>
  </g>

  <rect x="0" y="338" width="1280" height="2" fill="url(#rule)"/>
</svg>
